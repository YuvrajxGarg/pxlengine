[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pxlengine"
version = "0.1.0"
description = "Python SDK for pxlengine: build scene JSON and render it with the pxl binary"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }

[tool.setuptools]
packages = ["pxl"]
