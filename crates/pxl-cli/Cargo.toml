[package]
name = "pxl-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pxl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
png.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "exr"] }
serde_json.workspace = true
pxl-scene = { path = "../pxl-scene" }
pxl-gpu = { path = "../pxl-gpu" }
pxl-render = { path = "../pxl-render" }
