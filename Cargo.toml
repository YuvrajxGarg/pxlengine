[workspace]
resolver = "2"
members = ["crates/pxl-scene", "crates/pxl-assets", "crates/pxl-gpu", "crates/pxl-render", "crates/pxl-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
ash = { version = "0.38", features = ["loaded"] }
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
clap = { version = "4", features = ["derive"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
